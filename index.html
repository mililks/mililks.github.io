<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TSNNSBND4Q"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-TSNNSBND4Q');
</script>
  <title>Не скам</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Відео займає весь екран без смуг прокрутки */
    .fullscreen-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover; /* Розтягує відео без спотворення пропорцій */
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- 
    autoplay: запускає відео автоматично
    muted: обов'язково для автозапуску в браузерах
    loop: повторює відео по колу
    playsinline: забезпечує коректне відтворення на iOS без примусового повноекранного плеєра
  -->
  <video class="fullscreen-video" autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
    Ваш браузер не підтримує тег відео.
  </video>

</body>
</html>
